name: 05 - CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]    

jobs:
    frontend-lint:
      runs-on: ubuntu-24.04
      steps:
        - uses: actions/checkout@v6                   
        - uses: ./.github/actions/setup-pnpm-ci-cd     
        - name: Lint
          run: |
                cd 09-ci-cd
                echo "::group::lint"
                pnpm lint:frontend
                echo "::endgroup::"

    frontend-test:
      runs-on: ubuntu-24.04
      steps:
        - uses: actions/checkout@v6  
        - uses: ./.github/actions/setup-pnpm-ci-cd     
        - name: Test
          run: |
                cd 09-ci-cd
                echo "::group::test"
                pnpm test:frontend
                echo "::endgroup::"

    frontend-build:
      needs: [frontend-lint, frontend-test]
      runs-on: ubuntu-24.04
      steps:
        - uses: actions/checkout@v6  
        - uses: ./.github/actions/setup-pnpm-ci-cd     
        - name: Build
          run: |
                cd 09-ci-cd
                echo "::group::build"
                pnpm build:frontend
                echo "::endgroup::"                

    backend-lint:
      runs-on: ubuntu-24.04
      steps:
          - uses: actions/checkout@v6  
          - uses: ./.github/actions/setup-pnpm-ci-cd     
          - name: Lint
            run: |
                  cd 09-ci-cd
                  echo "::group::lint"
                  pnpm lint:backend
                  echo "::endgroup::"
                  
    backend-test:
      runs-on: ubuntu-24.04
      steps:
          - uses: actions/checkout@v6          
          - uses: ./.github/actions/setup-pnpm-ci-cd           
          - name: Test
            run: |
                  cd 09-ci-cd
                  echo "::group::test"
                  pnpm test:backend
                  echo "::endgroup::"
  
    backend-smoke-test:
      needs: [backend-lint, backend-test]
      runs-on: ubuntu-24.04
      steps:
          - uses: actions/checkout@v6          
          - uses: ./.github/actions/setup-pnpm-ci-cd           
          - name: Smoke Test
            run: |
                  cd 09-ci-cd
                  echo "::group::smoke test"
                  pnpm build:backend
                  pnpm start:backend
                  curl -X GET http://localhost:3000/api/v1/health
                  pnpm stop:backend
                  echo "::endgroup::"                  